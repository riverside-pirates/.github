name: Offer to speak
description: Share your work with Riverside CS and Engineering students.
title: "Speaker: "
labels: [speaker]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for offering! A teacher will reply here. Please don't include student information.
  - type: input
    id: who
    attributes:
      label: Who are you?
      description: Your role and organization. Leave out anything you'd rather not post publicly.
      placeholder: Software engineer at a Durham startup
    validations:
      required: true
  - type: textarea
    id: topic
    attributes:
      label: What would you talk about?
      description: A few sentences. Career path, a project, a tool, a day in the life.
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Format
      multiple: true
      options:
        - In person at Riverside
        - Video call
        - Recorded video
        - Q&A on GitHub
    validations:
      required: true
  - type: input
    id: when
    attributes:
      label: When works?
      placeholder: Weekday mornings in the spring
